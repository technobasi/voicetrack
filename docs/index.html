<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VoiceTrack — Weiterleitung...</title>
    <meta http-equiv="refresh" content="0; url=https://voicetrack.clevereducate.de" />
    <link rel="canonical" href="https://voicetrack.clevereducate.de" />
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #0b0f19;
        color: #f1f5f9;
        padding: 1.5rem;
        box-sizing: border-box;
      }
      .card {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 1rem;
        padding: 2.5rem 2rem;
        max-width: 420px;
        width: 100%;
        text-align: center;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
      }
      .spinner {
        width: 48px;
        height: 48px;
        margin: 0 auto 1.5rem;
        border: 4px solid #334155;
        border-top-color: #38bdf8;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      h1 {
        font-size: 1.35rem;
        font-weight: 600;
        margin: 0 0 0.5rem;
        color: #f8fafc;
      }
      p {
        color: #94a3b8;
        font-size: 0.95rem;
        margin: 0 0 1.75rem;
        line-height: 1.5;
      }
      .btn {
        display: inline-block;
        background: #2563eb;
        color: #ffffff;
        text-decoration: none;
        padding: 0.75rem 1.5rem;
        border-radius: 0.5rem;
        font-weight: 500;
        font-size: 0.95rem;
        transition: background-color 0.2s ease;
      }
      .btn:hover {
        background: #1d4ed8;
      }
      .url {
        margin-top: 1.25rem;
        font-size: 0.75rem;
        color: #64748b;
        word-break: break-all;
      }
    </style>
    <script>
      const targetUrl = "https://voicetrack.clevereducate.de";
      window.location.replace(targetUrl);
    </script>
  </head>
  <body>
    <div class="card">
      <div class="spinner"></div>
      <h1>Weiterleitung zu VoiceTrack</h1>
      <p>Du wirst automatisch zu deiner Instanz weitergeleitet...</p>
      <a class="btn" href="https://voicetrack.clevereducate.de">Jetzt öffnen</a>
      <div class="url">Ziel: https://voicetrack.clevereducate.de</div>
    </div>
  </body>
</html>
